<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f10"/>
      <stop offset="50%" stop-color="#141d20"/>
      <stop offset="100%" stop-color="#091418"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-opacity="0.2" stroke-width="8"/>

  <!-- Glow effect -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- Orbital Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-dasharray="600 200" stroke-linecap="round" transform="rotate(-45 256 256)"/>
  <circle cx="256" cy="256" r="95" fill="none" stroke="url(#accentGrad)" stroke-opacity="0.4" stroke-width="6"/>

  <!-- Core Icon: Hexagon Life Matrix + AI Sparkle -->
  <path d="M 256 160 L 330 202 L 330 298 L 256 340 L 182 298 L 182 202 Z" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linejoin="round"/>
  
  <!-- AI Sparkle Core -->
  <path d="M 256 200 Q 256 256 200 256 Q 256 256 256 312 Q 256 256 312 256 Q 256 256 256 200 Z" fill="url(#accentGrad)"/>
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>
  
  <!-- Corner Nodes -->
  <circle cx="256" cy="160" r="10" fill="#38bdf8"/>
  <circle cx="330" cy="202" r="10" fill="#34d399"/>
  <circle cx="330" cy="298" r="10" fill="#818cf8"/>
  <circle cx="256" cy="340" r="10" fill="#38bdf8"/>
  <circle cx="182" cy="298" r="10" fill="#34d399"/>
  <circle cx="182" cy="202" r="10" fill="#818cf8"/>
</svg>
